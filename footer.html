            gap: 0.8rem;
            align-items: center;
            flex-wrap: wrap;
            margin-top: 0px;

        .social-circle-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #8b5e3c;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            transition: 0.2s ease;
        }

        .social-circle-icon svg {
            width: 18px;
            height: 18px;
            stroke: #ddd;
            stroke-width: 1.5;
            fill: none;
        }

        .social-circle-icon:hover {
            background: #68472e;
            transform: translateY(-2px);
        }

        .social-circle-icon:hover svg {
            stroke: white;
        }

        /* نمادهای اعتماد - استایل مخصوص اینماد و بقیه */
        .trust-images {

  color: var(--color--black);
}
