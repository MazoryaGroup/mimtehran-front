name: Deploy Application

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, mazorya]

    steps:
      # ۱. دریافت آخرین نسخه از کدهای ریپازیتوری
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ۲. ریستارت و بیلد کانتینرها روی سرور
      - name: Build and Deploy via Docker Compose
        run: |
          docker compose down
          docker compose up -d --build

      # ۳. پاکسازی ایمیج‌های قدیمی و بدون استفاده (جهت جلوگیری از پر شدن حافظه سرور)
      - name: Cleanup unused Docker images
        run: |
          docker image prune -f