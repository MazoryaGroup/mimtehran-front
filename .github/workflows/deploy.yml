name: Deploy Mimtehran Front

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Deploy project
        run: |
          cd /opt/docker/stacks/mimtehran-front/mimtehran-front
          git fetch origin main
          git reset --hard origin/main
          docker compose up -d --build